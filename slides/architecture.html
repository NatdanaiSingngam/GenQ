<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GenQ Architecture</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f172a;
    --fg: #e5e7eb;
    --muted: #94a3b8;
    --line: #475569;
    --neutral: #1e293b;
    --input: #1e3a5f;
    --process: #312e81;
    --storage: #134e4a;
    --external: #713f12;
    --accent: #6366f1;
    --success: #10b981;
    --warn: #f59e0b;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
  svg { width: 100%; height: auto; display: block; }
  text { font-family: ui-sans-serif, system-ui, sans-serif; }
  .title { font-size: 22px; font-weight: 700; fill: var(--fg); }
  .subtitle { font-size: 13px; fill: var(--muted); }
  .label { font-size: 13px; font-weight: 600; fill: var(--fg); }
  .small { font-size: 11px; fill: var(--muted); }
  .badge { font-size: 10px; fill: var(--muted); }
  .node { stroke: var(--line); stroke-width: 1.5; rx: 8; }
  .neutral { fill: var(--neutral); }
  .input-box { fill: var(--input); }
  .process-box { fill: var(--process); }
  .storage-box { fill: var(--storage); }
  .external-box { fill: var(--external); }
  .accent-box { fill: var(--accent); }
  .edge { stroke: var(--line); stroke-width: 1.5; fill: none; }
  .edge-accent { stroke: var(--accent); stroke-width: 2; fill: none; }
  .zone { fill: none; stroke: var(--line); stroke-width: 1; stroke-dasharray: 6 5; }
  .marker { fill: var(--line); }
</style>
<main>
  <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
        <path d="M0,0 L10,5 L0,10 Z" class="marker" />
      </marker>
      <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
        <path d="M0,0 L10,5 L0,10 Z" fill="#6366f1" />
      </marker>
    </defs>

    <!-- Title -->
    <text x="480" y="30" text-anchor="middle" class="title">GenQ — System Architecture</text>
    <text x="480" y="50" text-anchor="middle" class="subtitle">AI-Powered Quiz Generator from Lecture Slides</text>

    <!-- ============= ZONE: User ============= -->
    <rect x="30" y="75" width="900" height="120" rx="10" class="zone" />
    <text x="45" y="95" class="badge">USER LAYER</text>

    <!-- Browser -->
    <rect x="80" y="110" width="180" height="60" rx="8" class="neutral node" />
    <text x="170" y="136" text-anchor="middle" class="label">Browser</text>
    <text x="170" y="152" text-anchor="middle" class="small">React + Vite SPA</text>

    <!-- GitHub Repo -->
    <rect x="340" y="110" width="180" height="60" rx="8" class="neutral node" />
    <text x="430" y="136" text-anchor="middle" class="label">GitHub Repository</text>
    <text x="430" y="152" text-anchor="middle" class="small">NatdanaiSingngam/GenQ</text>

    <!-- Developer -->
    <rect x="600" y="110" width="180" height="60" rx="8" class="neutral node" />
    <text x="690" y="136" text-anchor="middle" class="label">Developer</text>
    <text x="690" y="152" text-anchor="middle" class="small">wrangler CLI / git push</text>

    <!-- ============= ZONE: Cloudflare ============= -->
    <rect x="30" y="215" width="900" height="290" rx="10" class="zone" />
    <text x="45" y="235" class="badge">CLOUDFLARE EDGE — FREE TIER</text>

    <!-- Pages: Frontend -->
    <rect x="80" y="255" width="220" height="70" rx="8" class="input-box node" />
    <text x="190" y="282" text-anchor="middle" class="label">Cloudflare Pages</text>
    <text x="190" y="299" text-anchor="middle" class="small">Frontend (genq-dlg.pages.dev)</text>
    <text x="190" y="314" text-anchor="middle" class="small">React SPA · Auto-deploy on git push</text>

    <!-- Worker: API -->
    <rect x="370" y="255" width="220" height="70" rx="8" class="process-box node" />
    <text x="480" y="282" text-anchor="middle" class="label">Cloudflare Worker</text>
    <text x="480" y="299" text-anchor="middle" class="small">genq-api · Hono Framework</text>
    <text x="480" y="314" text-anchor="middle" class="small">Quiz CRUD · Auth · Upload</text>

    <!-- Workers AI -->
    <rect x="660" y="255" width="220" height="70" rx="8" class="accent-box node" />
    <text x="770" y="282" text-anchor="middle" class="label">Workers AI</text>
    <text x="770" y="299" text-anchor="middle" class="small">@cf/meta/llama-3.2-3b-instruct</text>
    <text x="770" y="314" text-anchor="middle" class="small">10k req/day · ~2-4s generation</text>

    <!-- KV Storage -->
    <rect x="80" y="360" width="220" height="70" rx="8" class="storage-box node" />
    <text x="190" y="387" text-anchor="middle" class="label">Cloudflare KV</text>
    <text x="190" y="404" text-anchor="middle" class="small">GENQ_KV · Quiz persistence</text>
    <text x="190" y="419" text-anchor="middle" class="small">7-day TTL · JSON documents</text>

    <!-- D1 Database -->
    <rect x="370" y="360" width="220" height="70" rx="8" class="process-box node" />
    <text x="480" y="387" text-anchor="middle" class="label">Cloudflare D1</text>
    <text x="480" y="404" text-anchor="middle" class="small">SQLite (ready, not active)</text>
    <text x="480" y="419" text-anchor="middle" class="small">For future structured queries</text>

    <!-- ============= ZONE: External ============= -->
    <rect x="30" y="525" width="900" height="60" rx="10" class="zone" />
    <text x="45" y="545" class="badge">FALLBACK PROVIDERS</text>

    <rect x="80" y="540" width="250" height="35" rx="6" class="external-box node" />
    <text x="205" y="562" text-anchor="middle" class="small">Gemini 2.0 Flash (secondary)</text>

    <rect x="400" y="540" width="250" height="35" rx="6" class="external-box node" />
    <text x="525" y="562" text-anchor="middle" class="small">Mock Quiz Generator (tertiary)</text>

    <!-- ============= CONNECTORS ============= -->

    <!-- User → Pages (browse) -->
    <path d="M170,170 L170,245" class="edge" marker-end="url(#arrow)" />
    <text x="160" y="215" class="small" text-anchor="end">HTTPS</text>

    <!-- Pages → Worker (API calls) -->
    <path d="M300,290 L360,290" class="edge" marker-end="url(#arrow)" />
    <text x="330" y="282" text-anchor="middle" class="small">fetch /api/*</text>

    <!-- User → Worker (direct upload) -->
    <path d="M80,140 L40,140 L40,330 L70,330" class="edge" marker-end="url(#arrow)" />
    <text x="30" y="240" class="small" text-anchor="end">Upload PDF/PPTX/DOCX/TXT</text>

    <!-- Developer → GitHub → Pages -->
    <path d="M690,170 L690,220 L620,220 L620,255" class="edge" marker-end="url(#arrow)" />
    <text x="650" y="215" class="small" text-anchor="end">git push</text>

    <path d="M430,170 L430,245" class="edge" marker-end="url(#arrow)" />
    <text x="440" y="215" class="small" text-anchor="start">Auto-deploy</text>

    <!-- Worker → AI -->
    <path d="M590,290 L650,290" class="edge-accent" marker-end="url(#arrow-accent)" />
    <text x="620" y="282" text-anchor="middle" class="small" fill="#6366f1">env.AI</text>

    <!-- Worker → KV -->
    <path d="M370,360 L300,360" class="edge" marker-end="url(#arrow)" />
    <text x="335" y="352" text-anchor="middle" class="small">env.GENQ_KV</text>

    <!-- Worker → D1 -->
    <path d="M480,325 L480,350" class="edge" marker-end="url(#arrow)" />
    <text x="490" y="342" class="small" text-anchor="start">env.GENQ_DB</text>

    <!-- Worker → Fallbacks -->
    <path d="M480,325 L480,480 L480,530" class="edge" marker-end="url(#arrow)" />
    <text x="490" y="475" class="small" text-anchor="start">Fallback chain</text>

    <!-- AI → Worker (response) -->
    <path d="M770,325 L770,480 L590,480 L590,325" class="edge" marker-end="url(#arrow)" />
    <text x="680" y="475" text-anchor="middle" class="small">Generated quiz JSON</text>

    <!-- Legend -->
    <rect x="30" y="600" width="900" height="50" rx="6" class="neutral node" />
    <rect x="50" y="612" width="16" height="16" rx="3" class="input-box" />
    <text x="72" y="625" class="small">Frontend</text>
    <rect x="150" y="612" width="16" height="16" rx="3" class="process-box" />
    <text x="172" y="625" class="small">Backend</text>
    <rect x="260" y="612" width="16" height="16" rx="3" class="storage-box" />
    <text x="282" y="625" class="small">Storage</text>
    <rect x="370" y="612" width="16" height="16" rx="3" class="accent-box" />
    <text x="392" y="625" class="small">AI</text>
    <rect x="460" y="612" width="16" height="16" rx="3" class="external-box" />
    <text x="482" y="625" class="small">External</text>
    <text x="580" y="625" class="small">→ AI Fallback: Workers AI → Gemini → Mock</text>
  </svg>
</main>
